[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sios-monitor"
version = "0.1.0"
description = "Minimal collector of public SIOS environmental-card metadata"
requires-python = ">=3.7"
dependencies = [
  "httpx>=0.24,<0.25",
  "beautifulsoup4>=4.12",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0,<8"]

[project.scripts]
sios-collector = "src.sios.collector:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
